name: Java CI/CD with Maven and GitHub Releases (Production)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Run tests with Maven
        run: mvn -B test --file pom.xml

      - name: Run Code Coverage with Maven
        run: mvn -B test jacoco:report --file pom.xml

      # Publicar JAR como artefacto del pipeline
      - name: Publish JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-artifact
          path: target/*.jar

      # Publicar Reporte de Pruebas
      - name: Publish Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-artifact
          path: target/surefire-reports/

      # Publicar Reporte de Cobertura
      - name: Publish Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report-artifact
          path: target/site/jacoco/

  # Job que publica la Release oficial cuando se hace push de un tag (v1.0.0, etc.)
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR for Release
        run: mvn -B package -DskipTests --file pom.xml

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp target/*.jar release-assets/app-${{ github.ref_name }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/app-${{ github.ref_name }}.jar
          generate_release_notes: true
          draft: false
          prerelease: false